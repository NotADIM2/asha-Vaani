services:
  - type: web
    name: asha-vaani
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
